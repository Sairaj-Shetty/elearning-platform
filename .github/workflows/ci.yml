name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: |
          set +e
          mvn -B test > ../mvn-test.log 2>&1
          code=$?
          tail -n 120 ../mvn-test.log
          if [ "$code" -ne 0 ]; then
            tail -n 30 ../mvn-test.log | while IFS= read -r line; do
              [ -z "$line" ] && line="(blank)"
              echo "::error title=maven::${line}"
            done
            exit "$code"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build
