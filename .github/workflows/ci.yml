name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mvn -B test > ../mvn-test.log 2>&1
          code=$?
          tail -n 80 ../mvn-test.log
          if [ "$code" -ne 0 ]; then
            python3 - << 'PY'
            import json
            from pathlib import Path
            lines = Path("../mvn-test.log").read_text(errors="replace").splitlines()
            picked = [line for line in lines if "[ERROR]" in line or "FAILURE!" in line or "Tests run:" in line or "Caused by:" in line]
            body = "Backend CI failed.\n\n```\n" + "\n".join((picked or lines)[-25:]) + "\n```"
            Path("../ci-comment.json").write_text(json.dumps({"body": body[:60000]}))
            PY
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" --input ../ci-comment.json || true
            exit "$code"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build
