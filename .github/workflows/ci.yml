name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mvn -B test > ../mvn-test.log 2>&1
          code=$?
          tail -n 80 ../mvn-test.log
          if [ "$code" -ne 0 ]; then
            i=0
            grep -E "\[ERROR\]|FAILURE!|Tests run:|Caused by:" ../mvn-test.log | head -n 6 | while IFS= read -r line; do
              i=$((i+1))
              desc=$(printf '%s' "$line" | tr '\r' ' ' | cut -c1-130)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state=failure -f context="maven-${i}" -f description="$desc" || true
            done
            exit "$code"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build
