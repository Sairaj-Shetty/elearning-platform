name: lumina

services:
  mongo:
    image: mongo:8.0
    hostname: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 8s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/lumina?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-use-32chars-min}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-LuminaDev#2026}
      MEDIA_ROOT: /data/media
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    volumes:
      - media_data:/data/media
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  media_data:
